[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require real API keys (Azure Vision, OpenAI)",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
